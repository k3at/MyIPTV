# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 turns on its new DSL + built-in Kotlin by default. That combination is
# not compatible with the classic org.jetbrains.kotlin.android plugin, so turn
# both off and keep the well-understood classic Kotlin setup.
android.newDsl=false
android.builtInKotlin=false
